<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存在·计数</title>
    <style>
        :root {
            --bg: #050507;
            --fg: #f0f0f0;
            --accent: #ff4d4d;
            --glow: rgba(255, 77, 77, 0.7);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body {
            background: radial-gradient(ellipse at center, #111 0%, #050507 70%, #000 100%);
            color: var(--fg);
            font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1200px;
            cursor: crosshair;
        }

        /* ===== 场景容器：承载整体3D空间 ===== */
        .scene {
            position: relative;
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 2rem;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* ===== 标题 ===== */
        .title {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.8em;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 0.5rem;
            transform: translateZ(30px);
            transition: var(--transition);
        }

        .subtitle {
            font-size: 0.75rem;
            opacity: 0.35;
            letter-spacing: 0.3em;
            margin-bottom: 3rem;
            transform: translateZ(20px);
            transition: var(--transition);
        }

        /* ===== 计数器主体 ===== */
        .counter-wrapper {
            position: relative;
            margin: 2rem 0 4rem;
            transform-style: preserve-3d;
        }

        .counter {
            font-size: 9rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.06em;
            text-shadow:
                0 0 20px var(--glow),
                0 0 60px var(--glow),
                0 0 100px var(--glow);
            transition: var(--transition);
            transform: translateZ(80px);
            will-change: transform, text-shadow;
            font-variant-numeric: tabular-nums;
        }

        /* 计数器背后的光晕球 */
        .counter-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            margin: -150px 0 0 -150px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 65%);
            opacity: 0.25;
            z-index: -1;
            transform: translateZ(0px);
            transition: opacity 0.6s ease;
            animation: breathe 5s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(0.85); opacity: 0.18; }
            100% { transform: scale(1.15); opacity: 0.32; }
        }

        /* 装饰环 */
        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(-30px) rotateX(75deg);
            pointer-events: none;
        }
        .ring.r1 { width: 280px; height: 280px; }
        .ring.r2 { width: 400px; height: 400px; border-color: rgba(255,255,255,0.05); }
        .ring.r3 { width: 540px; height: 540px; border-color: rgba(255,255,255,0.03); }

        /* ===== 按钮组 ===== */
        .buttons {
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            align-items: center;
            transform: translateZ(50px);
            transition: var(--transition);
        }

        button {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            color: var(--fg);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            width: 76px;
            height: 76px;
            font-size: 1.8rem;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            outline: none;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            transition: all 0.4s ease;
            z-index: -1;
            border-radius: 50%;
        }

        button:hover {
            transform: scale(1.15) translateZ(20px);
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(255,77,77,0.3), inset 0 0 20px rgba(255,77,77,0.1);
        }

        button:hover::before { opacity: 0.25; transform: translate(-50%, -50%) scale(1.3); }

        button:active {
            transform: scale(0.92) translateZ(10px);
            transition: all 0.1s ease;
        }

        #reset { width: 60px; height: 60px; font-size: 1.3rem; opacity: 0.7; }

        /* ===== 粒子系统 ===== */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: -3;
        }

        .particle {
            position: absolute;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: float linear infinite;
            will-change: transform;
        }

        @keyframes float {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ===== 底部哲学文字 ===== */
        .philosophy {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            opacity: 0.2;
            letter-spacing: 0.4em;
            transition: opacity 0.6s ease;
        }

        .philosophy:hover { opacity: 0.5; }

        /* ===== 角落装饰 ===== */
        .corner {
            position: fixed;
            width: 30px; height: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: var(--transition);
            z-index: 10;
        }
        .corner.tl { top: 2rem; left: 2rem; border-right: none; border-bottom: none; }
        .corner.tr { top: 2rem; right: 2rem; border-left: none; border-bottom: none; }
        .corner.bl { bottom: 2rem; left: 2rem; border-right: none; border-top: none; }
        .corner.br { bottom: 2rem; right: 2rem; border-left: none; border-top: none; }

        /* ===== 数值变化时的数字动效 ===== */
        .counter.flip {
            animation: flipIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes flipIn {
            0%   { transform: translateZ(80px) scale(1.4) rotateX(-20deg); filter: blur(4px); }
            60%  { transform: translateZ(100px) scale(0.95) rotateX(5deg); filter: blur(0); }
            100% { transform: translateZ(80px) scale(1) rotateX(0); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .counter { font-size: 5.5rem; }
            .buttons { gap: 1.2rem; }
            button { width: 60px; height: 60px; font-size: 1.4rem; }
            #reset { width: 48px; height: 48px; font-size: 1rem; }
            .ring.r3 { display: none; }
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <!-- 角落装饰 -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- 3D 场景 -->
    <div class="scene" id="scene">
        <div class="title">存在 · 计数</div>
        <div class="subtitle">EXISTENCE IN COUNTING</div>

        <div class="counter-wrapper">
            <div class="ring r3"></div>
            <div class="ring r2"></div>
            <div class="ring r1"></div>
            <div class="counter-glow"></div>
            <div class="counter" id="counter">0</div>
        </div>

        <div class="buttons">
            <button id="decrement" aria-label="减少">−</button>
            <button id="reset" aria-label="重置">↺</button>
            <button id="increment" aria-label="增加">+</button>
        </div>
    </div>

    <div class="philosophy">网页即存在 · 存在即网页</div>

    <script>
        // ====== 核心状态 ======
        const counterEl = document.getElementById('counter');
        let count = 0;

        // ====== 动态粒子系统 ======
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = window.innerWidth < 600 ? 25 : 70;

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 3 + 1;
                const posX = Math.random() * 100;
                const delay = Math.random() * 20;
                const duration = 12 + Math.random() * 18;
                const opacity = 0.15 + Math.random() * 0.4;
                p.style.width = p.style.height = size + 'px';
                p.style.left = posX + '%';
                p.style.animationDelay = delay + 's';
                p.style.animationDuration = duration + 's';
                p.style.opacity = opacity;
                container.appendChild(p);
            }
        }

        // ====== 更新计数显示 ======
        function updateCounter() {
            counterEl.textContent = count;
            counterEl.classList.remove('flip');
            void counterEl.offsetWidth; // 强制重绘，重启动画
            counterEl.classList.add('flip');

            // 随数值改变主题色相
            const hue = (count * 7) % 360;
            document.documentElement.style.setProperty('--accent', `hsl(${hue}, 80%, 60%)`);
            document.documentElement.style.setProperty('--glow', `hsla(${hue}, 80%, 60%, 0.7)`);
        }

        // ====== 按钮事件 ======
        document.getElementById('increment').addEventListener('click', () => { count++; updateCounter(); });
        document.getElementById('decrement').addEventListener('click', () => { count--; updateCounter(); });
        document.getElementById('reset').addEventListener('click', () => { count = 0; updateCounter(); });

        // ====== 键盘支持 ======
        document.addEventListener('keydown', (e) => {
            if (e.key === '+' || e.key === '=') { count++; updateCounter(); }
            else if (e.key === '-' || e.key === '_') { count--; updateCounter(); }
            else if (e.key === '0' || e.key === 'r') { count = 0; updateCounter(); }
        });

        // ====== ★ 极致 3D 视差系统 ★ ======
        const scene = document.getElementById('scene');
        const glow = document.querySelector('.counter-glow');
        const rings = document.querySelectorAll('.ring');
        let targetX = 0, targetY = 0;      // 目标旋转值
        let currentX = 0, currentY = 0;      // 当前旋转值（平滑插值）
        let rafId = null;

        function onMouseMove(e) {
            // 归一化鼠标位置：中心为原点，范围 -1 ~ 1
            const nx = (e.clientX / window.innerWidth) * 2 - 1;
            const ny = (e.clientY / window.innerHeight) * 2 - 1;

            // 目标旋转角度（非线性映射，增强边缘灵敏度）
            targetX = ny * -14;  // 上下 → 绕X轴
            targetY = nx * 18;   // 左右 → 绕Y轴
        }

        // 平滑插值动画循环
        function animate() {
            // 缓动逼近：每一帧向目标值靠近一部分
            currentX += (targetX - currentX) * 0.07;
            currentY += (targetY - currentY) * 0.07;

            // 1) 场景整体 3D 旋转
            scene.style.transform =
                `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

            // 2) 光晕反向微移，营造景深层次
            const glowX = currentY * 1.5;
            const glowY = -currentX * 1.5;
            glow.style.transform =
                `translate(calc(-50% + ${glowX}px), calc(-50% + ${glowY}px))`;

            // 3) 装饰环以不同速率反向旋转，形成视差差速
            rings.forEach((ring, i) => {
                const depth = (i + 1) * 0.3;
                ring.style.transform =
                    `translate(-50%, -50%) translateZ(${-30 - i * 30}px) rotateX(75deg)
                     rotateZ(${currentY * depth}deg)`;
            });

            // 4) 角落装饰随视角微微移动
            const corners = document.querySelectorAll('.corner');
            corners.forEach(corner => {
                corner.style.transform =
                    `translate(${-currentY * 0.4}px, ${-currentX * 0.4}px)`;
            });

            rafId = requestAnimationFrame(animate);
        }

        // 鼠标离开时平滑回正
        function onMouseLeave() {
            targetX = 0;
            targetY = 0;
        }

        // 触摸屏支持：跟随手指
        function onTouchMove(e) {
            if (e.touches.length > 0) {
                onMouseMove(e.touches[0]);
            }
        }

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseleave', onMouseLeave);
        document.addEventListener('touchmove', onTouchMove, { passive: true });
        document.addEventListener('touchend', onMouseLeave);

        // ====== 初始化 ======
        createParticles();
        updateCounter();
        animate();
    </script>
</body>
</html>
